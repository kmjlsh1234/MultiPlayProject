syntax = "proto3";
package Protocol;

option csharp_namespace = "Google.Protobuf.Protocol";

message ObjectInfo {
    int32 objectId = 1;
    int32 templateId = 2;
    PositionInfo pos = 3;
    CellInfo cellInfo = 4;
    StateInfo stateInfo = 5;
    int32 targetId = 6;
}

message PartyRoomInfo {
    int32 roomId = 1;
    int32 masterId = 2;
    repeated PartyPlayerInfo players = 3;
}

message MatchRoomInfo {
    int32 roomId = 1;
    int32 masterId = 2;
    repeated MatchPlayerInfo players = 3;
}

message GameRoomInfo {
    int32 roomId = 1;
    int32 masterId = 2;
    repeated ObjectInfo players = 3;
    int32 randomSeed = 4;
}

message PartyPlayerInfo {
    int32 sessionId = 1;
    string nickName = 2;
    bool isReady = 3;
}

message MatchPlayerInfo {
    int32 sessionId = 1;
    string nickName = 2;
    bool isReady = 3;
}

message PositionInfo{
    float posX = 1;
    float posY = 2;
    float posZ = 3;
}

message InputInfo{
    float x = 1;
    float y = 2;
    float z = 3;
}

message StateInfo{
    int32 level = 1;
    int32 hp = 2;
    int32 maxHp = 3;
    int32 attack = 4;
    float speed = 5;
}

message CellInfo{
    int32 x = 1;
    int32 y = 2;
}

message SkillInfo{
    int32 id = 1;
    int32 skillLevel = 2;
    int32 skillDamage = 4;
    float skillCoolTime = 5;
    float skillSize = 6;
    float skillReach = 7;
    float duration = 8;
    float skillObjScale = 9;
    float skillObjSpeed = 10;
}
