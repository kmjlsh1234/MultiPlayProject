syntax = "proto3";
package Protocol;

import "google/protobuf/timestamp.proto";
import "Protocol_Enum.proto";
option csharp_namespace = "Google.Protobuf.Protocol";

message Objectinfo {
    int32 objectId = 1;
    int32 templateId = 2;
    Positioninfo pos = 3;
    Cellinfo cellInfo = 4;
    Stateinfo stateInfo = 5;
    int32 targetId = 6;
}

message Partyroominfo {
    int32 roomId = 1;
    int32 masterId = 2;
    repeated Partyplayerinfo players = 3;
}

message Matchroominfo {
    int32 roomId = 1;
    int32 masterId = 2;
    repeated Matchplayerinfo players = 3;
}

message Gameroominfo {
    int32 roomId = 1;
    int32 masterId = 2;
    repeated Objectinfo players = 3;
    int32 randomSeed = 4;
}

message Partyplayerinfo {
    int32 sessionId = 1;
    string nickName = 2;
    bool isReady = 3;
}

message Matchplayerinfo {
    int32 sessionId = 1;
    string nickName = 2;
    bool isReady = 3;
}

message Positioninfo{
    float posX = 1;
    float posY = 2;
    float posZ = 3;
}

message Inputinfo{
    float x = 1;
    float y = 2;
    float z = 3;
}

message Stateinfo{
    int32 level = 1;
    int32 hp = 2;
    int32 maxHp = 3;
    int32 attack = 4;
    float speed = 5;
}

message Cellinfo{
    int32 x = 1;
    int32 y = 2;
}

message Skillinfo{
    int32 id = 1;
    int32 skillLevel = 2;
    int32 skillDamage = 4;
    float skillCoolTime = 5;
    float skillSize = 6;
    float skillReach = 7;
    float duration = 8;
    float skillObjScale = 9;
    float skillObjSpeed = 10;
}
