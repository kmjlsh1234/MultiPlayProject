syntax = "proto3";
package Protocol;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Protobuf.Protocol";

message Playerinfo {
    int32 sessionId = 1;
    string nickName = 2;
    bool isReady = 3;
}

message S_Roominfo{
    int32 roomId = 1;
    int32 masterId = 2;
    repeated Playerinfo players = 4;
}
