syntax = "proto3";
package Protocol;

import "google/protobuf/timestamp.proto";
import "Protocol_Enum.proto";
import "Protocol_Data.proto"; 
option csharp_namespace = "Google.Protobuf.Protocol";

message C_Joinroom{
    int32 roomId = 1;
}

message S_Gameroominfo {
    Gameroominfo roomInfo = 1;
}

message S_Inviteroom{
