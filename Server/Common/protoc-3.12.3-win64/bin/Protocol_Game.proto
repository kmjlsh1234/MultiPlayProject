syntax = "proto3";
package Protocol;

import "google/protobuf/timestamp.proto";
import "Protocol_Enum.proto";
import "Protocol_Data.proto"; 
option csharp_namespace = "Google.Protobuf.Protocol";

message C_Joinroom{
    int32 roomId = 1;
}

message S_Gameroominfo {
    Gameroominfo roomInfo = 1;
}

message S_Inviteroom{
    int32 roomId = 1;
}

message S_Entergameroom{
}

message C_Exitgameroom {
}

message S_Exitgameroom {
    int32 sessionId = 1;
}

message C_Move{
    float posX = 1;
    float posY = 2;
    float posZ = 3;
    float rotY = 4;
    CreatureState state = 5;
}

message S_Move{
    int32 sessionId =1;
    float posX = 2;
    float posY = 3;
    float posZ = 4;
    float rotY = 5;
    CreatureState state = 6;
}

message C_Input{
    float dirX = 1;
    float dirY = 2;
    float dirZ = 3;
    Cellinfo cellInfo = 4;
}

message S_Input{
    int32 sessionId = 1;
    float dirX = 2;
    float dirY = 3;
    float dirZ = 4;
    Cellinfo cellInfo = 5;
}

message S_Ingamestart{
    
}

message S_Spawnenemy{
    Objectinfo objectInfo = 1;
}

message C_Enemymove {
    repeated Objectinfo enemies = 1;
}

message S_Enemymove {
    repeated Objectinfo enemies = 1;
}

message C_Skill {
    
}

message S_Skill {

}