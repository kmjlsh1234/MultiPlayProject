syntax = "proto3";
package Protocol;

import "Protocol_Enum.proto";
import "Protocol_Data.proto"; 
option csharp_namespace = "Google.Protobuf.Protocol";

message C_JoinRoom{
    int32 roomId = 1;
}

message S_GameRoomInfo {
    GameRoomInfo roomInfo = 1;
}

message S_InviteRoom{
    int32 roomId = 1;
}

message S_EnterGameRoom{
}

message C_ExitGameRoom {
}

message S_ExitGameRoom {
    int32 sessionId = 1;
}

message C_Move{
    float posX = 1;
    float posY = 2;
    float posZ = 3;
    float rotY = 4;
    CreatureState state = 5;
}

message S_Move{
    int32 sessionId =1;
    float posX = 2;
    float posY = 3;
    float posZ = 4;
    float rotY = 5;
    CreatureState state = 6;
}

message C_Input{
    InputInfo input = 1;
    CellInfo cellInfo = 2;
}

message S_Input{
    int32 sessionId = 1;
    InputInfo input = 2;
    CellInfo cellInfo = 3;
}

message S_InGameStart{
    
}

message S_SpawnEnemy{
    ObjectInfo objectInfo = 1;
}

message C_EnemyMove {
    repeated ObjectInfo enemies = 1;
}

message S_EnemyMove {
    repeated ObjectInfo enemies = 1;
}

message C_Skill {
    int32 id = 1;
}

message S_Skill {
    int32 sessionId = 1;
    int32 skillId = 2;
}

message C_Exp{
    int32 expCount = 1;
}

message S_Exp {
    int32 expCount = 1;
}

message S_LevelUp {

}

message C_NewSkill {
    SkillInfo skillinfo = 1;
}

message C_UpgradeSkill{
    SkillInfo skillinfo = 1;
}

message S_SkillSelect{
    int32 sessionId = 1;
    SkillInfo skillinfo = 2;
}

message S_LevelUpFinish{

}
