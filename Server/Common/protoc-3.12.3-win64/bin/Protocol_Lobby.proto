syntax = "proto3";
package Protocol;
import "Protocol_Data.proto"; 

option csharp_namespace = "Google.Protobuf.Protocol";

message C_Connect {
    string nickName = 1;
}

message S_Connect{
    int32 sessionId = 1;
}

message C_CreateRoom {

}

message C_CreatePartyRoom {

}

message C_EnterPartyRoom {
    int32 roomId = 1;
}

message C_ExitPartyRoom {

}

message S_EnterPartyRoom{
    PartyPlayerInfo playerInfo = 1;
}

message S_PartyRoomInfo {
    PartyRoomInfo roomInfo = 1;
}

message S_ExitPartyRoom {
    int32 sessionId = 1;
}

message C_CreateOrJoinRoom{

}

message C_Invite{
    int32 sessionId = 1;
}

message S_Invite{
    int32 roomId = 1;
    int32 sessionId = 2;
    string nickName = 3;
}

message C_Ready{
    bool isReady = 1;
}

message S_Ready{
    int32 sessionId = 1;
    bool isReady = 2;
}