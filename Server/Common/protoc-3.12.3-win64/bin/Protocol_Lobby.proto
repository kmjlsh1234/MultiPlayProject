syntax = "proto3";
package Protocol;
import "Protocol_Data.proto"; 
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Protobuf.Protocol";

message C_Connect {
    string nickName = 1;
}

message S_Connect{
    int32 sessionId = 1;
}

message C_Createroom {

}

message C_Createpartyroom {

}

message C_Enterpartyroom {
    int32 roomId = 1;
}

message C_Exitpartyroom {

}

message S_Enterpartyroom{
    Partyplayerinfo playerInfo = 1;
}

message S_Partyroominfo {
    Partyroominfo roomInfo = 1;
}

message S_Exitpartyroom {
    int32 sessionId = 1;
}

message C_Createorjoinroom{

}

message C_Invite{
    int32 sessionId = 1;
}

message S_Invite{
    int32 roomId = 1;
    int32 sessionId = 2;
    string nickName = 3;
}

message C_Ready{
    bool isReady = 1;
}

message S_Ready{
    int32 sessionId = 1;
    bool isReady = 2;
}