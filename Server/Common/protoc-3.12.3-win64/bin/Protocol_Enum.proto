syntax = "proto3";
package Protocol;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Google.Protobuf.Protocol";

enum MsgId {
    C_PINGCHECK = 0;
    S_PONGCHECK = 1;

    S_CONNECT = 2;
    C_PLAYERINFO = 3;
    
    C_CHAT = 4;
    S_CHAT = 5;
    
    C_READY = 6;
    S_READY = 7;
    
    C_START = 8;
    S_LOADINGSTART = 9;
    
    C_MOVE = 10;
    S_MOVE = 11;

    C_EXITROOM = 12;
    S_EXITROOM = 13;

    S_CHANGEROOMINFO = 14;

    C_CREATEROOM = 15;
    C_CREATEORJOINROOM = 16;
    
    C_ENTERMATCHROOM = 17;
