syntax = "proto3";
package Protocol;

option csharp_namespace = "Google.Protobuf.Protocol";

message C_PingCheck{

}

message S_PongCheck{

}

message C_Chat{
    string message = 1;
}

message S_Chat{
    int32 sessionId = 1;
    string nickName = 2;
    string message = 3;
}

message S_ErrorCode{
    int32 code = 1;
    string message = 2;
}